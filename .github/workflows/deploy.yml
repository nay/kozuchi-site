name: Deploy Jekyll site to Pages

on:
  push:
    branches:
      - jekyll
    # gem・Ruby の更新や CI の設定だけでは、サイトの中身は変わらないので公開しない
    # （次に記事などを公開するときに一緒に反映される）
    paths-ignore:
      - Gemfile.lock
      - .ruby-version
      - .github/**
  # 記事を足さずに公開し直したいとき（テーマの更新を先に出すときなど）に手動で動かす
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
